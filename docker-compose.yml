services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andora-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./output_dokumen:/app/output_dokumen
      - ./temp_uploads:/app/temp_uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andora-worker
    restart: unless-stopped
    command: python -m app.voice_agent start
    env_file:
      - .env
    depends_on:
      - api
    volumes:
      - ./output_dokumen:/app/output_dokumen
      - ./temp_uploads:/app/temp_uploads
