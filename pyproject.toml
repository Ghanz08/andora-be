[project]
name = "andora-be"
version = "0.1.0"
description = "ANDORA Backend - Voice-first AI assistant for public administrative procedures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "supabase>=2.8.0",
    "openai>=1.50.0",
    "livekit-api>=1.0.0",
    "livekit-agents[google]==1.8.2",
    "faster-whisper>=1.2,<2",
    "docxtpl>=0.19.0,<1",
    "pdfplumber>=0.11.0,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
